<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Ürün Yönetimi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body class="admin-panel-body">

    <header class="admin-header">
        <h1>ÖrgüDunyası Admin Paneli</h1>
        <button id="logout-btn" class="admin-btn btn-danger">Çıkış Yap</button>
    </header>

    <main class="admin-container">
        <!-- Yeni Ürün Ekleme Formu -->
        <div class="form-container">
            <h2>Yeni Ürün Ekle</h2>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="name">Ürün Adı</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="color">Renk</label>
                    <input type="text" id="color" required>
                </div>
                <div class="form-group">
                    <label for="price">Fiyat (₺)</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="image">Resim URL</label>
                    <input type="text" id="image" required>
                </div>
                <button type="submit" class="admin-btn">Ürünü Ekle</button>
            </form>
        </div>

        <!-- Mevcut Ürünler Listesi -->
        <div class="product-list-container">
            <h2>Mevcut Ürünler</h2>
            <table id="products-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ürün Adı</th>
                        <th>Fiyat</th>
                        <th>Renk</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Ürünler JavaScript ile buraya yüklenecek -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- YENİ: Düzenleme Modalı (Eksik Olan Kısım Burasıydı) -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Ürünü Düzenle</h2>
            <form id="edit-product-form">
                <input type="hidden" id="edit-product-id">
                <div class="form-group">
                    <label for="edit-name">Ürün Adı</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-color">Renk</label>
                    <input type="text" id="edit-color" required>
                </div>
                <div class="form-group">
                    <label for="edit-price">Fiyat (₺)</label>
                    <input type="number" id="edit-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="edit-image">Resim URL</label>
                    <input type="text" id="edit-image" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="admin-btn">Kaydet</button>
                    <button type="button" id="cancel-edit" class="admin-btn btn-danger">İptal</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
